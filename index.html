<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Для мамы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a0f1f; --paper: #ffe9ef; --paper2: #f7cfdb; --ink: #4a1830; --heart: #e0245e; --soft: #b98aa0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #4a1a34 0%, var(--bg) 70%);
    color: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font: 16px/1.4 "Lora", Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  .book {
    position: relative; width: min(86vw, 360px); height: min(72vh, 500px);
    perspective: 1800px; cursor: pointer;
  }
  .leaf {
    position: absolute; inset: 0; transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform .95s cubic-bezier(.45,.05,.2,1), opacity .2s;
  }
  .leaf.flipped { transform: rotateY(-172deg); opacity: 0; transition: transform .95s cubic-bezier(.45,.05,.2,1), opacity .25s .62s; pointer-events: none; }
  .face {
    position: absolute; inset: 0; border-radius: 6px 18px 18px 6px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 6px 0 10px -6px rgba(74,24,48,.35);
  }
  .front { background: linear-gradient(100deg, var(--paper2) 0, var(--paper) 7%, var(--paper) 100%); }
  .back { background: var(--paper2); transform: rotateY(180deg); }

  h1 { font: 400 40px/1.15 "Marck Script", cursive; margin: 18px 0 0; }
  .text { font: 400 28px/1.35 "Marck Script", cursive; margin: 0; text-wrap: balance; }
  .sign { font: 400 26px/1.3 "Marck Script", cursive; margin: 28px 0 0; color: var(--heart); }
  .hint { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-style: italic; font-size: 14px; color: var(--soft); }

  .heart { width: 150px; height: 140px; filter: drop-shadow(0 8px 14px rgba(224,36,94,.35)); animation: beat 1.8s ease-in-out infinite; transform-origin: 50% 60%; }
  .heart.small { width: 44px; height: 41px; animation: none; margin-top: 22px; filter: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.09); } 28% { transform: scale(1); } 42% { transform: scale(1.06); } 56% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .heart { animation: none; } .leaf { transition-duration: .01s; } }

  .bar { display: flex; align-items: center; gap: 18px; }
  .bar button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,233,239,.25);
    background: transparent; color: var(--paper); font-size: 22px; line-height: 1; cursor: pointer;
  }
  .bar button:disabled { opacity: .3; cursor: default; }
  .bar button:focus-visible { outline: 2px solid var(--heart); outline-offset: 2px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,233,239,.28); transition: background .3s, transform .3s; }
  .dot.on { background: var(--heart); transform: scale(1.3); }
</style>
</head>
<body>

<div class="book" id="book" aria-live="polite"></div>

<div class="bar">
  <button id="prev" type="button" aria-label="Назад">‹</button>
  <div class="dots" id="dots"></div>
  <button id="next" type="button" aria-label="Дальше">›</button>
</div>

<script>
  // ====== ТЕКСТЫ: можно менять ======
  const TITLE = 'Привет, дорогая мамуля';
  const PAGES = [
    'Ты самый родной человек на свете. Спасибо, что ты у меня есть.',
    'Ты мне очень дорога и безмерно любима.',
    'Твоя забота согревает меня, даже когда мы далеко друг от друга.',
    'Спасибо за твоё терпение, мудрость и тёплые объятия.',
    'Будь здорова и счастлива. Я всегда рядом. Люблю тебя, мамуля!'
  ];
  const SIGN = 'Твой любимый Игорек ❤️‍🩹';
  // ==================================

  const HEART = (cls) => '<svg class="heart ' + cls + '" viewBox="0 0 100 92" aria-hidden="true"><path fill="#e0245e" d="M50 90C20 66 2 48 2 28 2 13 14 2 28 2c9 0 17 4 22 12C55 6 63 2 72 2c14 0 26 11 26 26 0 20-18 38-48 62z"/><path fill="#fff" fill-opacity=".28" d="M22 16c-7 3-11 10-10 18 0-6 4-12 11-14 4-1 7 0 9 2-2-4-6-7-10-6z"/></svg>';

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); if (tg.setHeaderColor) { try { tg.setHeaderColor('#2a0f1f'); tg.setBackgroundColor('#2a0f1f'); } catch (e) {} } }

  const book = document.getElementById('book');
  const total = PAGES.length + 1;            // обложка + страницы
  let flipped = 0;                           // сколько листов уже перелистано

  const leaves = [];
  for (let i = 0; i < total; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.zIndex = total - i;
    const front = i === 0
      ? HEART('') + '<h1>' + TITLE + '</h1><div class="hint">Нажмите, чтобы открыть</div>'
      : '<p class="text">' + PAGES[i - 1] + '</p>' + (i === total - 1 ? '<p class="sign">' + SIGN + '</p>' : '');
    leaf.innerHTML = '<div class="face front">' + front + '</div><div class="face back"></div>';
    book.appendChild(leaf);
    leaves.push(leaf);
  }

  const dots = document.getElementById('dots');
  dots.innerHTML = leaves.map(() => '<span class="dot"></span>').join('');
  const dotEls = dots.children;
  const prev = document.getElementById('prev'), next = document.getElementById('next');

  function render() {
    leaves.forEach((l, i) => l.classList.toggle('flipped', i < flipped));
    [...dotEls].forEach((d, i) => d.classList.toggle('on', i === flipped));
    prev.disabled = flipped === 0;
    next.disabled = flipped === total - 1;
  }
  function go(d) {
    const n = Math.max(0, Math.min(total - 1, flipped + d));
    if (n === flipped) return;
    flipped = n; render();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  }

  prev.addEventListener('click', () => go(-1));
  next.addEventListener('click', () => go(1));

  let x0 = null, swiped = false;
  book.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; swiped = false; }, { passive: true });
  book.addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { swiped = true; go(dx < 0 ? 1 : -1); }
  });
  book.addEventListener('click', (e) => {
    if (swiped) { swiped = false; return; }
    const r = book.getBoundingClientRect();
    go(e.clientX - r.left < r.width * 0.3 ? -1 : 1);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });

  render();
</script>
</body>
</html>
